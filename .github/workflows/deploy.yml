name: Publicar sitio en S3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compilar la aplicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar archivos estáticos
        run: npm run build

      - name: Guardar carpeta out/
        uses: actions/upload-artifact@v4
        with:
          name: sitio-estatico
          path: out/

  deploy:
    name: Publicar en S3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar carpeta out/
        uses: actions/download-artifact@v4
        with:
          name: sitio-estatico
          path: out/

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Subir out/ a S3
        run: aws s3 sync ./out s3://${{ secrets.S3_BUCKET }} --delete
